<text x="652" y="498" font-size="12" fill="#1565c0">IN3 ← D7 · GPIO13</text>
<text x="652" y="522" font-size="12" fill="#1565c0">IN4 ← D8 · GPIO15 *</text>
<text x="810" y="552" font-size="12" font-weight="bold" text-anchor="end" fill="#212121">– ← G</text>
<text x="810" y="578" font-size="12" font-weight="bold" text-anchor="end" fill="#d32f2f">+ ← VU (5 V)</text>
