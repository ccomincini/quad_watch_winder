<text x="730" y="670" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">Motore 28BYJ-48 5 V</text>
<text x="730" y="690" font-size="11" text-anchor="middle" fill="#555">nel connettore bianco del driver</text>
<path d="M 470 585 V 676 H 330" fill="none" stroke="#616161" stroke-width="6" stroke-linecap="round"/>
<text x="480" y="640" font-size="11.5" fill="#555">cavo micro-USB</text>
<rect x="90" y="645" width="240" height="62" rx="5" fill="#fdf6e3" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="210" y="670" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">Caricatore USB 5 V</text>
<text x="210" y="690" font-size="12" text-anchor="middle" fill="#333">almeno 1 A</text>
<line x1="40" y1="740" x2="1040" y2="740" stroke="#ddd" stroke-width="1"/>
<text x="40" y="764" font-size="13" font-weight="bold" fill="#111">Note</text>
<text xml:space="preserve" x="40" y="788" font-size="12" fill="#333">Collegamenti provati il 06/11/2026. Fili saldati sulle punte dei pin (piedini della scheda verso il basso).</text>
<text xml:space="preserve" x="40" y="808" font-size="12" fill="#333">* D8 (GPIO15) deve essere basso all'accensione: lo tengono basso la resistenza della scheda e l'ingresso del ULN2003 (verificato).</text>
<text xml:space="preserve" x="40" y="828" font-size="12" fill="#333">    Se la scheda non si avvia, spostare IN4 su D0 (GPIO16). Mai D3 e D4, che all'accensione devono restare alti.</text>
<text xml:space="preserve" x="40" y="848" font-size="12" fill="#333">VCC del modulo RTC sempre sul 3V della NodeMCU, mai sul 5 V.</text>
<text xml:space="preserve" x="40" y="868" font-size="12" fill="#333">Alimentazione solo dal micro-USB: mai collegare un secondo alimentatore su VU con il cavo USB inserito.</text>
<text xml:space="preserve" x="40" y="888" font-size="12" fill="#333">LED di stato: quello integrato su D4, nessun filo. Picco stimato circa 0,6 A (motore circa 0,2 A, ESP8266 fino a circa 0,35 A mentre trasmette).</text>
</svg>