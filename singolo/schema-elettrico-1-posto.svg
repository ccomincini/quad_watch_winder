<text x="540" y="52" font-size="13" text-anchor="middle" fill="#555">NodeMCU V3 (ESP8266) · 1 × 28BYJ-48 con ULN2003 · RTC DS3231 (ZS-042) · alimentazione solo da micro-USB</text>
