<line x1="652" y1="198" x2="813" y2="198" stroke="#d9c2e0" stroke-width="1"/>
<text x="652" y="218" font-size="12" fill="#4a148c">SCL ← D1 · GPIO5</text>
<text x="652" y="242" font-size="12" fill="#4a148c">SDA ← D2 · GPIO4</text>
<text x="652" y="314" font-size="12" fill="#4a148c">VCC ← 3V (3,3 V)</text>
<text x="652" y="338" font-size="12" fill="#4a148c">GND ← G</text>
<text x="732" y="268" font-size="11" text-anchor="middle" fill="#666">batteria CR2032</text>
<text x="732" y="283" font-size="11" text-anchor="middle" fill="#666">non ricaricabile</text>
