<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 920" width="1160" height="920" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1160" height="920" fill="#ffffff"/>

  <text x="580" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#111">Watch winder 4 posti — schema dei collegamenti</text>
  <text x="580" y="54" font-size="13" text-anchor="middle" fill="#555">Raspberry Pi Pico 2 W · 4 × 28BYJ-48 con ULN2003 · RTC DS3231 · distribuzione a stella su morsetti Wago</text>

  <!-- ================= ALIMENTATORE ================= -->
  <rect x="40" y="78" width="235" height="58" rx="5" fill="#fdf6e3" stroke="#8a6d1f" stroke-width="1.6"/>
  <text x="157" y="101" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">Alimentatore esterno</text>
  <text x="157" y="120" font-size="12.5" text-anchor="middle" fill="#333">5 V — 2,5 A — micro-USB</text>

  <!-- discesa positivo alimentatore -->
  <line x1="100" y1="136" x2="100" y2="190" stroke="#d32f2f" stroke-width="3.5"/>
  <circle cx="100" cy="190" r="5" fill="#d32f2f"/>
  <text x="88" y="163" font-size="11.5" text-anchor="end" fill="#d32f2f">+5 V</text>

  <!-- discesa negativo alimentatore, con scavalco della barra + -->
  <line x1="215" y1="136" x2="215" y2="182" stroke="#212121" stroke-width="3.5"/>
  <path d="M 215 182 A 8 8 0 0 1 215 198" fill="none" stroke="#212121" stroke-width="3.5"/>
  <line x1="215" y1="198" x2="215" y2="252" stroke="#212121" stroke-width="3.5"/>
  <circle cx="215" cy="252" r="5" fill="#212121"/>
  <text x="228" y="163" font-size="11.5" fill="#212121">GND</text>

  <!-- ================= BARRE WAGO ================= -->
  <rect x="60" y="184" width="1060" height="12" rx="6" fill="#d32f2f"/>
  <text x="1128" y="180" font-size="12.5" font-weight="bold" text-anchor="end" fill="#d32f2f">WAGO  +5 V   (nodo comune positivo)</text>

  <rect x="60" y="246" width="1060" height="12" rx="6" fill="#212121"/>
  <text x="1128" y="277" font-size="12.5" font-weight="bold" text-anchor="end" fill="#212121">WAGO  GND   (nodo comune negativo)</text>

  <!-- ================= CONDENSATORE ================= -->
  <line x1="150" y1="196" x2="150" y2="209" stroke="#d32f2f" stroke-width="3"/>
  <line x1="134" y1="209" x2="166" y2="209" stroke="#111" stroke-width="3.5"/>
  <path d="M 134 235 Q 150 224 166 235" fill="none" stroke="#111" stroke-width="3.5"/>
  <line x1="150" y1="235" x2="150" y2="246" stroke="#212121" stroke-width="3"/>
  <text x="141" y="206" font-size="13" font-weight="bold" text-anchor="end" fill="#d32f2f">+</text>
  <text x="176" y="219" font-size="12.5" font-weight="bold" fill="#111">1000 µF / 16 V</text>
  <text x="176" y="235" font-size="11.5" fill="#555">elettrolitico, al centro della stella</text>
  <text x="141" y="243" font-size="13" font-weight="bold" text-anchor="end" fill="#212121">–</text>

  <!-- ================= DRIVER ULN2003 ================= -->

  <!-- driver 1 -->
  <line x1="100" y1="330" x2="100" y2="258" stroke="#212121" stroke-width="2.6"/>
  <line x1="140" y1="330" x2="140" y2="266" stroke="#d32f2f" stroke-width="2.6"/>
  <path d="M 140 266 A 8 8 0 0 1 140 250" fill="none" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="140" y1="250" x2="140" y2="196" stroke="#d32f2f" stroke-width="2.6"/>
  <rect x="60" y="330" width="155" height="128" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/>
  <text x="137" y="352" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">ULN2003 #1</text>
  <line x1="72" y1="360" x2="203" y2="360" stroke="#c3d4e8" stroke-width="1"/>
  <text x="137" y="378" font-size="12" text-anchor="middle" fill="#1565c0">IN1 → GP6</text>
  <text x="137" y="395" font-size="12" text-anchor="middle" fill="#1565c0">IN2 → GP7</text>
  <text x="137" y="412" font-size="12" text-anchor="middle" fill="#1565c0">IN3 → GP8</text>
  <text x="137" y="429" font-size="12" text-anchor="middle" fill="#1565c0">IN4 → GP9</text>
  <text x="137" y="449" font-size="11" text-anchor="middle" fill="#666">+ e – dai Wago</text>

  <!-- driver 2 -->
  <line x1="275" y1="330" x2="275" y2="258" stroke="#212121" stroke-width="2.6"/>
  <line x1="315" y1="330" x2="315" y2="266" stroke="#d32f2f" stroke-width="2.6"/>
  <path d="M 315 266 A 8 8 0 0 1 315 250" fill="none" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="315" y1="250" x2="315" y2="196" stroke="#d32f2f" stroke-width="2.6"/>
  <rect x="235" y="330" width="155" height="128" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/>
  <text x="312" y="352" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">ULN2003 #2</text>
  <line x1="247" y1="360" x2="378" y2="360" stroke="#c3d4e8" stroke-width="1"/>
  <text x="312" y="378" font-size="12" text-anchor="middle" fill="#1565c0">IN1 → GP10</text>
  <text x="312" y="395" font-size="12" text-anchor="middle" fill="#1565c0">IN2 → GP11</text>
  <text x="312" y="412" font-size="12" text-anchor="middle" fill="#1565c0">IN3 → GP12</text>
  <text x="312" y="429" font-size="12" text-anchor="middle" fill="#1565c0">IN4 → GP13</text>
  <text x="312" y="449" font-size="11" text-anchor="middle" fill="#666">+ e – dai Wago</text>

  <!-- driver 3 -->
  <line x1="450" y1="330" x2="450" y2="258" stroke="#212121" stroke-width="2.6"/>
  <line x1="490" y1="330" x2="490" y2="266" stroke="#d32f2f" stroke-width="2.6"/>
  <path d="M 490 266 A 8 8 0 0 1 490 250" fill="none" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="490" y1="250" x2="490" y2="196" stroke="#d32f2f" stroke-width="2.6"/>
  <rect x="410" y="330" width="155" height="128" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/>
  <text x="487" y="352" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">ULN2003 #3</text>
  <line x1="422" y1="360" x2="553" y2="360" stroke="#c3d4e8" stroke-width="1"/>
  <text x="487" y="378" font-size="12" text-anchor="middle" fill="#1565c0">IN1 → GP2</text>
  <text x="487" y="395" font-size="12" text-anchor="middle" fill="#1565c0">IN2 → GP3</text>
  <text x="487" y="412" font-size="12" text-anchor="middle" fill="#1565c0">IN3 → GP4</text>
  <text x="487" y="429" font-size="12" text-anchor="middle" fill="#1565c0">IN4 → GP5</text>
  <text x="487" y="449" font-size="11" text-anchor="middle" fill="#666">+ e – dai Wago</text>

  <!-- driver 4 -->
  <line x1="625" y1="330" x2="625" y2="258" stroke="#212121" stroke-width="2.6"/>
  <line x1="665" y1="330" x2="665" y2="266" stroke="#d32f2f" stroke-width="2.6"/>
  <path d="M 665 266 A 8 8 0 0 1 665 250" fill="none" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="665" y1="250" x2="665" y2="196" stroke="#d32f2f" stroke-width="2.6"/>
  <rect x="585" y="330" width="155" height="128" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/>
  <text x="662" y="352" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">ULN2003 #4</text>
  <line x1="597" y1="360" x2="728" y2="360" stroke="#c3d4e8" stroke-width="1"/>
  <text x="662" y="378" font-size="12" text-anchor="middle" fill="#1565c0">IN1 → GP18</text>
  <text x="662" y="395" font-size="12" text-anchor="middle" fill="#1565c0">IN2 → GP19</text>
  <text x="662" y="412" font-size="12" text-anchor="middle" fill="#1565c0">IN3 → GP20</text>
  <text x="662" y="429" font-size="12" text-anchor="middle" fill="#1565c0">IN4 → GP21</text>
  <text x="662" y="449" font-size="11" text-anchor="middle" fill="#666">+ e – dai Wago</text>

  <!-- ================= MOTORI ================= -->
  <line x1="137" y1="458" x2="137" y2="512" stroke="#666" stroke-width="2.4"/>
  <line x1="312" y1="458" x2="312" y2="512" stroke="#666" stroke-width="2.4"/>
  <line x1="487" y1="458" x2="487" y2="512" stroke="#666" stroke-width="2.4"/>
  <line x1="662" y1="458" x2="662" y2="512" stroke="#666" stroke-width="2.4"/>
  <text x="147" y="486" font-size="10.5" fill="#666">5 fili</text>
  <text x="322" y="486" font-size="10.5" fill="#666">5 fili</text>
  <text x="497" y="486" font-size="10.5" fill="#666">5 fili</text>
  <text x="672" y="486" font-size="10.5" fill="#666">5 fili</text>

  <rect x="60" y="512" width="155" height="52" rx="5" fill="#f3f0f7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="137" y="533" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">28BYJ-48 · posto 1</text>
  <text x="137" y="551" font-size="11" text-anchor="middle" fill="#555">holder in presa diretta</text>

  <rect x="235" y="512" width="155" height="52" rx="5" fill="#f3f0f7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="312" y="533" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">28BYJ-48 · posto 2</text>
  <text x="312" y="551" font-size="11" text-anchor="middle" fill="#555">holder in presa diretta</text>

  <rect x="410" y="512" width="155" height="52" rx="5" fill="#f3f0f7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="487" y="533" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">28BYJ-48 · posto 3</text>
  <text x="487" y="551" font-size="11" text-anchor="middle" fill="#555">holder in presa diretta</text>

  <rect x="585" y="512" width="155" height="52" rx="5" fill="#f3f0f7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="662" y="533" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">28BYJ-48 · posto 4</text>
  <text x="662" y="551" font-size="11" text-anchor="middle" fill="#555">holder in presa diretta</text>

  <!-- ================= PICO ================= -->
  <line x1="845" y1="330" x2="845" y2="266" stroke="#d32f2f" stroke-width="2.6"/>
  <path d="M 845 266 A 8 8 0 0 1 845 250" fill="none" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="845" y1="250" x2="845" y2="196" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="915" y1="330" x2="915" y2="258" stroke="#212121" stroke-width="2.6"/>

  <rect x="800" y="330" width="190" height="234" rx="5" fill="#e9f6ee" stroke="#1b7a43" stroke-width="1.8"/>
  <text x="895" y="354" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Raspberry Pi Pico 2 W</text>
  <line x1="812" y1="362" x2="978" y2="362" stroke="#b9ded0" stroke-width="1"/>
  <text x="812" y="382" font-size="12" fill="#d32f2f">VSYS — pin 39 → Wago +5 V</text>
  <text x="812" y="401" font-size="12" fill="#212121">GND — pin 38 → Wago GND</text>
  <text x="812" y="428" font-size="12" fill="#1b7a43">3V3(OUT) — pin 36 → RTC</text>
  <text x="812" y="447" font-size="12" fill="#1565c0">GP26 — pin 31 → SDA (I2C1)</text>
  <text x="812" y="466" font-size="12" fill="#1565c0">GP27 — pin 32 → SCL (I2C1)</text>
  <line x1="812" y1="480" x2="978" y2="480" stroke="#b9ded0" stroke-width="1"/>
  <text x="812" y="500" font-size="11.5" font-weight="bold" fill="#b3261e">VBUS — pin 40: NON collegare</text>
  <text x="812" y="517" font-size="11" fill="#666">USB del computer collegabile</text>
  <text x="812" y="533" font-size="11" fill="#666">insieme all'alimentatore, grazie</text>
  <text x="812" y="549" font-size="11" fill="#666">al diodo interno VBUS→VSYS</text>

  <!-- segnali verso i driver -->
  <line x1="800" y1="590" x2="740" y2="590" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="800" y1="590" x2="800" y2="564" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="740,590 750,585 750,595" fill="#1565c0"/>
  <text x="736" y="608" font-size="11.5" text-anchor="end" fill="#1565c0">16 fili di segnale verso IN1..IN4 dei quattro driver</text>

  <!-- ================= RTC ================= -->
  <line x1="990" y1="425" x2="1020" y2="425" stroke="#1b7a43" stroke-width="2.4"/>
  <line x1="990" y1="444" x2="1020" y2="444" stroke="#1565c0" stroke-width="2.4"/>
  <line x1="990" y1="463" x2="1020" y2="463" stroke="#1565c0" stroke-width="2.4"/>
  <line x1="990" y1="482" x2="1020" y2="482" stroke="#212121" stroke-width="2.4"/>

  <rect x="1020" y="392" width="120" height="130" rx="5" fill="#fdf0f0" stroke="#b3261e" stroke-width="1.6"/>
  <text x="1080" y="414" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">DS3231SN</text>
  <text x="1080" y="430" font-size="11" text-anchor="middle" fill="#555">+ AT24C32</text>
  <line x1="1032" y1="438" x2="1128" y2="438" stroke="#eec9c9" stroke-width="1"/>
  <text x="1032" y="455" font-size="11.5" fill="#1b7a43">VCC ← 3V3</text>
  <text x="1032" y="472" font-size="11.5" fill="#1565c0">SDA ← GP26</text>
  <text x="1032" y="489" font-size="11.5" fill="#1565c0">SCL ← GP27</text>
  <text x="1032" y="506" font-size="11.5" fill="#212121">GND ← GND</text>

  <text x="1080" y="540" font-size="11" text-anchor="middle" fill="#b3261e">alimentato dal Pico,</text>
  <text x="1080" y="554" font-size="11" text-anchor="middle" fill="#b3261e">mai dai 5 V</text>

  <!-- ================= NOTE ================= -->
  <line x1="60" y1="628" x2="1120" y2="628" stroke="#ddd" stroke-width="1.5"/>
  <text x="60" y="656" font-size="14" font-weight="bold" fill="#111">Note di cablaggio</text>

  <text x="60" y="682" font-size="12.5" fill="#333"><tspan font-weight="bold">Stella.</tspan> Dall'alimentatore il positivo e il negativo arrivano a due morsetti Wago. Da quei due nodi partono, in parallelo e non a catena,</text>
  <text x="60" y="700" font-size="12.5" fill="#333">i rami per le quattro schede ULN2003, per il VSYS del Pico e per il condensatore.</text>

  <text x="60" y="726" font-size="12.5" fill="#333"><tspan font-weight="bold">Condensatore.</tspan> 1000 µF 16 V elettrolitico fra i due Wago, il piu' vicino possibile al nodo. Assorbe i transitori di spunto dei motori</text>
  <text x="60" y="744" font-size="12.5" fill="#333">ed evita i cali di tensione che farebbero riavviare il Pico. Rispettare la polarita': il terminale con la banda va sul Wago GND.</text>

  <text x="60" y="770" font-size="12.5" fill="#b3261e"><tspan font-weight="bold">Mai su VBUS.</tspan> Il pin 40 e' in diretta col connettore USB: alimentarlo retroalimenterebbe la porta del computer. Si usa VSYS (pin 39),</text>
  <text x="60" y="788" font-size="12.5" fill="#333">che accetta da 1,8 a 5,5 V ed e' a monte del regolatore interno.</text>

  <text x="60" y="814" font-size="12.5" fill="#333"><tspan font-weight="bold">RTC.</tspan> Il modulo va alimentato a 3,3 V dal pin 36 del Pico. A 5 V si attiverebbe il circuito di ricarica della batteria tampone, che</text>
  <text x="60" y="832" font-size="12.5" fill="#333">con una CR2032 non ricaricabile non deve mai intervenire.</text>

  <text x="60" y="858" font-size="12.5" fill="#333"><tspan font-weight="bold">Bus I2C.</tspan> GP26 e GP27 appartengono a I2C1, quindi nello sketch si usa <tspan font-family="Menlo, Consolas, monospace">Wire1</tspan> con <tspan font-family="Menlo, Consolas, monospace">setSDA</tspan> e <tspan font-family="Menlo, Consolas, monospace">setSCL</tspan>, non <tspan font-family="Menlo, Consolas, monospace">Wire</tspan>.</text>

  <text x="60" y="890" font-size="11" fill="#888">Le schede ULN2003 non vanno mai alimentate dai pin del Pico: la corrente di quattro 28BYJ-48 e' fuori portata per il regolatore interno.</text>

</svg>
