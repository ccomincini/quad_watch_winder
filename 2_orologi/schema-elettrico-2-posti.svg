<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="900" height="1010" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="900" height="1010" fill="#ffffff"/>

  <text x="450" y="34" font-size="21" font-weight="bold" text-anchor="middle" fill="#111">Watch winder 2 posti — schema dei collegamenti</text>
  <text x="450" y="54" font-size="13" text-anchor="middle" fill="#555">Raspberry Pi Pico 2 W · 2 × 28BYJ-48 con ULN2003 · RTC DS3231 · pulsante 16 mm · morsetti Wago</text>

  <!-- ================= ALIMENTATORE ================= -->
  <rect x="40" y="78" width="235" height="58" rx="5" fill="#fdf6e3" stroke="#8a6d1f" stroke-width="1.6"/>
  <text x="157" y="101" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">Alimentatore esterno</text>
  <text x="157" y="120" font-size="12.5" text-anchor="middle" fill="#333">5 V — 2,5 A — micro-USB</text>

  <!-- positivo alimentatore verso il pulsante -->
  <line x1="275" y1="107" x2="350" y2="107" stroke="#d32f2f" stroke-width="3.5"/>
  <text x="282" y="99" font-size="11.5" fill="#d32f2f">+5 V</text>

  <!-- discesa negativo alimentatore, con scavalco della barra + -->
  <line x1="215" y1="136" x2="215" y2="182" stroke="#212121" stroke-width="3.5"/>
  <path d="M 215 182 A 8 8 0 0 1 215 198" fill="none" stroke="#212121" stroke-width="3.5"/>
  <line x1="215" y1="198" x2="215" y2="252" stroke="#212121" stroke-width="3.5"/>
  <circle cx="215" cy="252" r="5" fill="#212121"/>
  <text x="228" y="163" font-size="11.5" fill="#212121">GND</text>

  <!-- ================= PULSANTE: CONTATTO ================= -->
  <rect x="320" y="66" width="230" height="84" rx="5" fill="#fff4e5" stroke="#e65100" stroke-width="1.6"/>
  <text x="435" y="84" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">Pulsante 16 mm — contatto</text>
  <circle cx="355" cy="107" r="5" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="440" cy="107" r="5" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="359" y1="104" x2="432" y2="90" stroke="#111" stroke-width="2.5"/>
  <text x="435" y="126" font-size="11" text-anchor="middle" fill="#555">interruttore generale sul +5 V</text>
  <text x="435" y="141" font-size="11" text-anchor="middle" fill="#555">a ritenuta (resta premuto)</text>

  <!-- uscita del pulsante verso il Wago + -->
  <line x1="445" y1="107" x2="580" y2="107" stroke="#d32f2f" stroke-width="3.5"/>
  <line x1="580" y1="107" x2="580" y2="190" stroke="#d32f2f" stroke-width="3.5"/>
  <circle cx="580" cy="190" r="5" fill="#d32f2f"/>

  <!-- ================= BARRE WAGO ================= -->
  <rect x="60" y="184" width="780" height="12" rx="6" fill="#d32f2f"/>
  <text x="840" y="180" font-size="12.5" font-weight="bold" text-anchor="end" fill="#d32f2f">WAGO  +5 V   (dopo il pulsante)</text>

  <rect x="60" y="246" width="780" height="12" rx="6" fill="#212121"/>
  <text x="840" y="277" font-size="12.5" font-weight="bold" text-anchor="end" fill="#212121">WAGO  GND</text>

  <!-- ================= CONDENSATORE ================= -->
  <line x1="660" y1="196" x2="660" y2="209" stroke="#d32f2f" stroke-width="3"/>
  <line x1="644" y1="209" x2="676" y2="209" stroke="#111" stroke-width="3.5"/>
  <path d="M 644 235 Q 660 224 676 235" fill="none" stroke="#111" stroke-width="3.5"/>
  <line x1="660" y1="235" x2="660" y2="246" stroke="#212121" stroke-width="3"/>
  <text x="651" y="206" font-size="13" font-weight="bold" text-anchor="end" fill="#d32f2f">+</text>
  <text x="686" y="219" font-size="12.5" font-weight="bold" fill="#111">1000 µF / 16 V</text>
  <text x="686" y="235" font-size="11.5" fill="#555">elettrolitico</text>
  <text x="638" y="243" font-size="13" font-weight="bold" text-anchor="end" fill="#212121">–</text>

  <!-- ================= DRIVER ULN2003 ================= -->

  <!-- driver 1 -->
  <line x1="100" y1="330" x2="100" y2="258" stroke="#212121" stroke-width="2.6"/>
  <line x1="140" y1="330" x2="140" y2="266" stroke="#d32f2f" stroke-width="2.6"/>
  <path d="M 140 266 A 8 8 0 0 1 140 250" fill="none" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="140" y1="250" x2="140" y2="196" stroke="#d32f2f" stroke-width="2.6"/>
  <rect x="60" y="330" width="155" height="128" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/>
  <text x="137" y="352" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">ULN2003 #1</text>
  <line x1="72" y1="360" x2="203" y2="360" stroke="#c3d4e8" stroke-width="1"/>
  <text x="137" y="378" font-size="12" text-anchor="middle" fill="#1565c0">IN1 → GP6</text>
  <text x="137" y="395" font-size="12" text-anchor="middle" fill="#1565c0">IN2 → GP7</text>
  <text x="137" y="412" font-size="12" text-anchor="middle" fill="#1565c0">IN3 → GP8</text>
  <text x="137" y="429" font-size="12" text-anchor="middle" fill="#1565c0">IN4 → GP9</text>
  <text x="137" y="449" font-size="11" text-anchor="middle" fill="#666">+ e – dai Wago</text>

  <!-- driver 2 -->
  <line x1="275" y1="330" x2="275" y2="258" stroke="#212121" stroke-width="2.6"/>
  <line x1="315" y1="330" x2="315" y2="266" stroke="#d32f2f" stroke-width="2.6"/>
  <path d="M 315 266 A 8 8 0 0 1 315 250" fill="none" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="315" y1="250" x2="315" y2="196" stroke="#d32f2f" stroke-width="2.6"/>
  <rect x="235" y="330" width="155" height="128" rx="5" fill="#eef4fb" stroke="#1565c0" stroke-width="1.6"/>
  <text x="312" y="352" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111">ULN2003 #2</text>
  <line x1="247" y1="360" x2="378" y2="360" stroke="#c3d4e8" stroke-width="1"/>
  <text x="312" y="378" font-size="12" text-anchor="middle" fill="#1565c0">IN1 → GP10</text>
  <text x="312" y="395" font-size="12" text-anchor="middle" fill="#1565c0">IN2 → GP11</text>
  <text x="312" y="412" font-size="12" text-anchor="middle" fill="#1565c0">IN3 → GP12</text>
  <text x="312" y="429" font-size="12" text-anchor="middle" fill="#1565c0">IN4 → GP13</text>
  <text x="312" y="449" font-size="11" text-anchor="middle" fill="#666">+ e – dai Wago</text>

  <!-- ================= MOTORI ================= -->
  <line x1="137" y1="458" x2="137" y2="512" stroke="#666" stroke-width="2.4"/>
  <line x1="312" y1="458" x2="312" y2="512" stroke="#666" stroke-width="2.4"/>
  <text x="147" y="486" font-size="10.5" fill="#666">5 fili</text>
  <text x="322" y="486" font-size="10.5" fill="#666">5 fili</text>

  <rect x="60" y="512" width="155" height="52" rx="5" fill="#f3f0f7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="137" y="533" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">28BYJ-48 · posto 1</text>
  <text x="137" y="551" font-size="11" text-anchor="middle" fill="#555">motore 1 del firmware</text>

  <rect x="235" y="512" width="155" height="52" rx="5" fill="#f3f0f7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="312" y="533" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">28BYJ-48 · posto 2</text>
  <text x="312" y="551" font-size="11" text-anchor="middle" fill="#555">motore 2 del firmware</text>

  <!-- ================= PICO ================= -->
  <line x1="495" y1="330" x2="495" y2="266" stroke="#d32f2f" stroke-width="2.6"/>
  <path d="M 495 266 A 8 8 0 0 1 495 250" fill="none" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="495" y1="250" x2="495" y2="196" stroke="#d32f2f" stroke-width="2.6"/>
  <line x1="565" y1="330" x2="565" y2="258" stroke="#212121" stroke-width="2.6"/>

  <rect x="450" y="330" width="190" height="234" rx="5" fill="#e9f6ee" stroke="#1b7a43" stroke-width="1.8"/>
  <text x="545" y="354" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Raspberry Pi Pico 2 W</text>
  <line x1="462" y1="362" x2="628" y2="362" stroke="#b9ded0" stroke-width="1"/>
  <text x="462" y="382" font-size="12" fill="#d32f2f">VSYS — pin 39 → Wago +5 V</text>
  <text x="462" y="401" font-size="12" fill="#212121">GND — pin 3 → Wago GND</text>
  <text x="462" y="428" font-size="12" fill="#1b7a43">3V3(OUT) — pin 36 → RTC</text>
  <text x="462" y="447" font-size="12" fill="#1565c0">GP26 — pin 31 → SDA (I2C1)</text>
  <text x="462" y="466" font-size="12" fill="#1565c0">GP27 — pin 32 → SCL (I2C1)</text>
  <line x1="462" y1="480" x2="628" y2="480" stroke="#b9ded0" stroke-width="1"/>
  <text x="462" y="500" font-size="11.5" font-weight="bold" fill="#b3261e">VBUS — pin 40: NON collegare</text>
  <text x="462" y="517" font-size="11" fill="#666">GP2..GP5 e GP18..GP21</text>
  <text x="462" y="533" font-size="11" fill="#666">(posti 3 e 4 del firmware)</text>
  <text x="462" y="549" font-size="11" fill="#666">restano liberi</text>

  <!-- segnali verso i driver -->
  <line x1="450" y1="590" x2="390" y2="590" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="450" y1="590" x2="450" y2="564" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="390,590 400,585 400,595" fill="#1565c0"/>
  <text x="386" y="608" font-size="11.5" text-anchor="end" fill="#1565c0">8 fili di segnale verso IN1..IN4 dei due driver</text>

  <!-- ================= RTC ================= -->
  <line x1="640" y1="425" x2="670" y2="425" stroke="#1b7a43" stroke-width="2.4"/>
  <line x1="640" y1="444" x2="670" y2="444" stroke="#1565c0" stroke-width="2.4"/>
  <line x1="640" y1="463" x2="670" y2="463" stroke="#1565c0" stroke-width="2.4"/>
  <line x1="640" y1="482" x2="670" y2="482" stroke="#212121" stroke-width="2.4"/>

  <rect x="670" y="392" width="120" height="130" rx="5" fill="#fdf0f0" stroke="#b3261e" stroke-width="1.6"/>
  <text x="730" y="414" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">DS3231SN</text>
  <text x="730" y="430" font-size="11" text-anchor="middle" fill="#555">+ AT24C32</text>
  <line x1="682" y1="438" x2="778" y2="438" stroke="#eec9c9" stroke-width="1"/>
  <text x="682" y="455" font-size="11.5" fill="#1b7a43">VCC ← 3V3</text>
  <text x="682" y="472" font-size="11.5" fill="#1565c0">SDA ← GP26</text>
  <text x="682" y="489" font-size="11.5" fill="#1565c0">SCL ← GP27</text>
  <text x="682" y="506" font-size="11.5" fill="#212121">GND ← GND</text>

  <text x="730" y="540" font-size="11" text-anchor="middle" fill="#b3261e">alimentato dal Pico,</text>
  <text x="730" y="554" font-size="11" text-anchor="middle" fill="#b3261e">mai dai 5 V</text>

  <!-- ================= NOTE ================= -->
  <line x1="60" y1="636" x2="840" y2="636" stroke="#ddd" stroke-width="1.5"/>
  <text x="60" y="664" font-size="14" font-weight="bold" fill="#111">Note di cablaggio</text>

  <text x="60" y="690" font-size="12.5" fill="#333"><tspan font-weight="bold">Pulsante.</tspan> Il contatto va in serie sul positivo, fra l'alimentatore e il Wago +5 V: spegne tutto il caricatore.</text>
  <text x="60" y="708" font-size="12.5" fill="#333">Deve essere un pulsante a ritenuta (premuto resta acceso), non a impulso.</text>

  <text x="60" y="734" font-size="12.5" fill="#333"><tspan font-weight="bold">Solo USB.</tspan> Funziona anche con il solo cavo USB nel Pico: la corrente passa dal diodo VBUS-VSYS (1 A) ai Wago.</text>
  <text x="60" y="752" font-size="12.5" fill="#333">Serve un alimentatore USB da almeno 1 A; in quel caso il pulsante non spegne nulla e si stacca il cavo.</text>

  <text x="60" y="778" font-size="12.5" fill="#333"><tspan font-weight="bold">Stella e condensatore.</tspan> Dai due Wago partono in parallelo i rami per le due ULN2003, per il Pico</text>
  <text x="60" y="796" font-size="12.5" fill="#333">e per il condensatore da 1000 µF, che assorbe gli spunti dei motori. Il terminale con la banda va sul Wago GND.</text>

  <text x="60" y="822" font-size="12.5" fill="#b3261e"><tspan font-weight="bold">USB e pulsante spento.</tspan> Con il cavo USB del Mac collegato, il Pico porta la corrente della porta USB</text>
  <text x="60" y="840" font-size="12.5" fill="#333">sul Wago +5 V anche a pulsante spento, e da lì ai motori. Per usare il monitor seriale tenere il pulsante acceso.</text>

  <text x="60" y="866" font-size="12.5" fill="#b3261e"><tspan font-weight="bold">Mai su VBUS.</tspan> Il pin 40 è in diretta col connettore USB. Si usa VSYS (pin 39), che accetta da 1,8 a 5,5 V.</text>

  <text x="60" y="892" font-size="12.5" fill="#333"><tspan font-weight="bold">RTC.</tspan> Alimentato a 3,3 V dal pin 36 del Pico, con una CR2032 non ricaricabile: a 5 V si attiverebbe la ricarica.</text>

  <text x="60" y="918" font-size="12.5" fill="#333"><tspan font-weight="bold">Configurazione.</tspan> Firmware del 4 posti invariato. Da monitor seriale: <tspan font-family="Menlo, Consolas, monospace">e3 0</tspan>, <tspan font-family="Menlo, Consolas, monospace">e4 0</tspan> (posti 3 e 4 spenti),</text>
  <text x="60" y="936" font-size="12.5" fill="#333"><tspan font-family="Menlo, Consolas, monospace">r 1</tspan> (solo senso orario, per il Valjoux 7750), <tspan font-family="Menlo, Consolas, monospace">p 800</tspan> (giri al giorno), <tspan font-family="Menlo, Consolas, monospace">h 8 20</tspan> (fascia oraria), poi <tspan font-family="Menlo, Consolas, monospace">w</tspan> per salvare.</text>

  <text x="60" y="970" font-size="11" fill="#888">Meccanica: «Arduino Double Watch Winder» di JayS, Printables 1227833, CC BY-NC-SA 4.0. Le schede ULN2003 non vanno mai</text>
  <text x="60" y="986" font-size="11" fill="#888">alimentate dai pin del Pico.</text>

</svg>
